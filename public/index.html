<!doctype html><html lang="kk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grammar Quest | Student</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:linear-gradient(130deg,#dff7ff,#f1e6ff,#fff5df);color:#263453;min-height:100vh;padding:22px}.card{background:white;max-width:650px;margin:28px auto;padding:28px;border-radius:26px;box-shadow:0 12px 35px #465c8a25}h1{color:#6044b8}button{cursor:pointer;border:0;border-radius:12px;padding:13px 17px;background:#7055d7;color:white;font-weight:700;font-size:16px}input{width:100%;padding:14px;border:2px solid #d6d0ef;border-radius:12px;font-size:18px;margin:10px 0 18px}.words,.answer{display:flex;flex-wrap:wrap;gap:10px;min-height:72px;padding:15px;border:2px dashed #b5a8e9;border-radius:16px;margin:16px 0;background:#f8f7ff}.tile{padding:12px 15px;background:#f6d9ff;border:2px solid #aa8ae2;border-radius:12px;color:#332761;font-weight:700;cursor:grab;touch-action:none;user-select:none}.answer .tile{background:#d5f4ff}.muted{color:#69738b}.status{font-weight:700;margin:12px 0}.hidden{display:none}.good{color:#17834e}.bad{color:#c03945}</style>
<div class="card"><h1>🌈 Grammar Quest</h1><p class="muted">Have to · Has to · Don't have to · Doesn't have to</p><section id="join"><p>Аты-жөніңізді жазыңыз:</p><input id="name" placeholder="Мысалы: Айдана Әли" maxlength="60"><button id="start">Ойынды бастау</button></section><section id="game" class="hidden"><h3 id="progress"></h3><p id="kk"></p><p class="muted">Сөздерді төмендегі жауап алаңына сүйреп апарыңыз немесе басып орналастырыңыз.</p><div id="answer" class="answer"></div><div id="bank" class="words"></div><button id="submit">Жауапты жіберу (бір мүмкіндік)</button><div id="feedback" class="status" aria-live="polite"></div><button id="next" class="hidden">Келесі тапсырма →</button></section><section id="done" class="hidden"><h2>🎉 Ойын аяқталды!</h2><h1 id="total"></h1><p>Нәтиже мұғалімнің экранында көрінеді.</p></section><p id="err" class="bad"></p></div>
<script>
let questions=[],session=null,state=null,chosen=[],locked=false;const $=x=>document.getElementById(x);const api=async(url,data)=>{let r=await fetch(url,{method:data?'POST':'GET',headers:{'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});let j=await r.json();if(!r.ok)throw Error(j.error||'Қате');return j};function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function show(id){['join','game','done'].forEach(k=>$(k).classList.toggle('hidden',k!==id))}function render(){if(state.next>=5){show('done');$('total').textContent=state.score+' / 5 балл';return}show('game');let q=questions[state.next];$('progress').textContent=`Тапсырма ${state.next+1} / 5 · Ұпай: ${state.score}`;$('kk').textContent=q.kk;chosen=[];locked=false;$('feedback').textContent='';$('next').classList.add('hidden');$('submit').classList.remove('hidden');let items=q.words.map((w,i)=>({w,i}));state.pool=shuffle(items);draw()}
function draw(){for(let id of ['bank','answer'])$(id).innerHTML='';function tile(item,parent){let el=document.createElement('div');el.className='tile';el.textContent=item.w;el.draggable=true;el.dataset.id=item.i;el.addEventListener('click',()=>{if(locked)return;chosen.includes(item.i)?chosen=chosen.filter(x=>x!==item.i):chosen.push(item.i);draw()});el.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',String(item.i)));parent.append(el)}state.pool.filter(x=>!chosen.includes(x.i)).forEach(x=>tile(x,$('bank')));chosen.map(i=>state.pool.find(x=>x.i===i)).forEach(x=>tile(x,$('answer')))}
for(let id of ['answer','bank']){$(id).addEventListener('dragover',e=>e.preventDefault());$(id).addEventListener('drop',e=>{e.preventDefault();if(locked)return;let i=Number(e.dataTransfer.getData('text/plain'));if(!state.pool.some(x=>x.i===i))return;chosen=chosen.filter(x=>x!==i);if(id==='answer')chosen.push(i);draw()})}
$('start').onclick=async()=>{try{$('err').textContent='';let name=$('name').value.trim();session=await api('/api/join',{name});localStorage.setItem('grammarQuestSession',JSON.stringify(session));questions=await api('/api/questions');state=await api('/api/state?id='+encodeURIComponent(session.id)+'&token='+encodeURIComponent(session.token));render()}catch(e){$('err').textContent=e.message}};
$('submit').onclick=async()=>{if(locked)return;if(chosen.length!==questions[state.next].words.length){$('feedback').textContent='Барлық сөзді орналастырыңыз.';return}locked=true;$('submit').disabled=true;try{let answer=chosen.map(i=>state.pool.find(x=>x.i===i).w);let result=await api('/api/answer',{...session,answer});state.score=result.score;state.next=result.next;$('feedback').textContent=result.correct?'✓ Дұрыс! +1 балл':'✗ Қате. 0 балл. Қайта орындауға болмайды.';$('feedback').className='status '+(result.correct?'good':'bad');$('submit').classList.add('hidden');$('next').classList.remove('hidden');$('next').textContent=result.finished?'Нәтижені көру →':'Келесі тапсырма →'}catch(e){$('feedback').textContent=e.message}finally{$('submit').disabled=false}};
$('next').onclick=render;
(async()=>{try{let s=JSON.parse(localStorage.getItem('grammarQuestSession')||'null');if(s){session=s;questions=await api('/api/questions');state=await api('/api/state?id='+encodeURIComponent(s.id)+'&token='+encodeURIComponent(s.token));render()}}catch{localStorage.removeItem('grammarQuestSession')}})();
</script></html>
