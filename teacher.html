<!doctype html><html lang="kk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grammar Quest | Teacher</title><style>body{font-family:system-ui;background:#f2f4ff;color:#273153;margin:0;padding:24px}.card{max-width:1000px;margin:auto;background:white;padding:25px;border-radius:20px;box-shadow:0 8px 28px #3332}input,button{padding:12px;border-radius:9px;font-size:16px}button{background:#674ad1;color:white;border:0;cursor:pointer}input{border:1px solid #aaa}table{border-collapse:collapse;width:100%;margin-top:20px}th,td{text-align:left;padding:13px;border-bottom:1px solid #e4e4ef}th{background:#eae5ff}img{max-width:220px}#dashboard{display:none}.muted{color:#68738a}</style><div class="card"><h1>👩‍🏫 Мұғалім панелі</h1><div id="login"><p>Мұғалім құпиясөзін енгізіңіз:</p><input type="password" id="password"><button onclick="login()">Кіру</button><p id="error" style="color:#b22"></p></div><div id="dashboard"><h2>📱 Оқушыларға QR-код</h2><img id="qr" alt="Ойынға кіру QR-коды"><p id="url"></p><p class="muted">Оқушылар QR-ды сканерлеп, аты-жөнін енгізеді. Нәтижелер 3 секунд сайын жаңарады.</p><h2>🏆 Нәтижелер</h2><p id="count"></p><table><thead><tr><th>Оқушы</th><th>Ұпай</th><th>Орындалған тапсырма</th><th>Күйі</th></tr></thead><tbody id="rows"></tbody></table></div></div><script>let pass='';async function get(url){let r=await fetch(url,{headers:{'x-teacher-password':pass}});if(!r.ok)throw Error('Құпиясөз қате немесе сервер қолжетімсіз');return r}async function login(){pass=document.getElementById('password').value;try{await get('/api/results');document.getElementById('login').style.display='none';document.getElementById('dashboard').style.display='block';document.getElementById('url').textContent=location.origin+'/';let b=await(await get('/api/qr')).blob();document.getElementById('qr').src=URL.createObjectURL(b);refresh();setInterval(refresh,3000)}catch(e){document.getElementById('error').textContent=e.message}}async function refresh(){try{let data=await(await get('/api/results')).json();document.getElementById('count').textContent='Барлығы: '+data.length+' оқушы';let body=document.getElementById('rows');body.replaceChildren();data.forEach(s=>{let tr=document.createElement('tr');[s.name,s.score+' / 5',s.completed+' / 5',s.finished?'Аяқтады':'Орындауда'].forEach(v=>{let td=document.createElement('td');td.textContent=v;tr.append(td)});body.append(tr)})}catch(e){document.getElementById('count').textContent=e.message}}</script></html>
